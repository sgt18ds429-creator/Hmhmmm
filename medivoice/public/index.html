<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0618">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ميدي فويز">
<title>ميدي فويز</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Reem+Kufi:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shell.css">
</head>
<body>
<canvas id="ribbon" aria-hidden="true"></canvas>

<div id="intro" aria-hidden="true">
  <svg class="mark" viewBox="-120 -120 540 540">
    <defs>
      <linearGradient id="mvg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#4d1ace"/><stop offset=".5" stop-color="#7a19c4"/><stop offset="1" stop-color="#9a18b8"/>
      </linearGradient>
    </defs>
    <rect class="tile" x="-120" y="-120" width="540" height="540" rx="126"/>
    <path class="stroke" pathLength="1" d="M283.5 35.7 L243.5 12.6 L150 66.6 L56.5 12.6 L16.5 35.7 L16.5 270 L46.5 287.3 L56.5 281.5 L56.5 231.8 L150 285.8 L204.5 254.3 L204.5 214.3 L150 245.8 L56.5 191.8 L56.5 58.8 L150 112.8 L243.5 58.8 L243.5 103.5 L150 157.5 L95.5 126 L95.5 166 L150 197.5 L243.5 143.5 L243.5 281.5 L253.5 287.3 L283.5 270 Z"/>
  </svg>
</div>

<main id="lock" hidden>
  <div class="lock-card">
    <div class="brand-tile">
      <svg viewBox="0 0 300 300" aria-hidden="true"><path d="M283.5 35.7 L243.5 12.6 L150 66.6 L56.5 12.6 L16.5 35.7 L16.5 270 L46.5 287.3 L56.5 281.5 L56.5 231.8 L150 285.8 L204.5 254.3 L204.5 214.3 L150 245.8 L56.5 191.8 L56.5 58.8 L150 112.8 L243.5 58.8 L243.5 103.5 L150 157.5 L95.5 126 L95.5 166 L150 197.5 L243.5 143.5 L243.5 281.5 L253.5 287.3 L283.5 270 Z"/></svg>
    </div>
    <h1 class="wordmark">ميدي فويز<small class="ltr">MediVoice</small></h1>
    <p class="tagline">تسجيل المحاضرة يصير ملزمة مشروحة بالتفصيل، بمصطلحاتها الطبية وصور مطابقة للشرح.</p>
    <form class="lock-form" id="lock-form" autocomplete="off" novalidate>
      <label for="code">اكتب كود التفعيل</label>
      <div class="code-box" id="code-box">
        <span class="pre">MV</span><span class="dash"></span>
        <span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span>
        <span class="dash"></span>
        <span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span>
        <input id="code" name="code" type="text" inputmode="text" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="16" aria-describedby="lock-msg" dir="ltr">
      </div>
      <p class="lock-msg" id="lock-msg" role="alert"></p>
      <button class="btn wide" id="lock-btn" type="submit" disabled>تفعيل</button>
    </form>
    <p class="lock-help" id="lock-help" hidden>ما عندك كود؟ <a id="lock-support" target="_blank" rel="noopener"></a></p>
  </div>
</main>

<div id="app" hidden></div>
<div id="toasts" role="status" aria-live="polite"></div>
<script type="module" src="/shell.js"></script>
</body>
</html>
