<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0618">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ميدي فويز">
<title>ميدي فويز</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/logo-96.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/fonts/el-messiri-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/shell.css">
</head>
<body>
<canvas id="ribbon" aria-hidden="true"></canvas>

<div id="intro" aria-hidden="true"><div class="intro-tile"></div></div>

<main id="lock" hidden>
  <div class="lock-card">
    <div class="brand-tile"></div>
    <h1 class="wordmark">ميدي فويز<small class="ltr">MediVoice</small></h1>
    <p class="tagline">تسجيل المحاضرة يصير ملزمة مشروحة بالتفصيل، بمصطلحاتها الطبية وصور مطابقة للشرح.</p>
    <form class="lock-form" id="lock-form" autocomplete="off" novalidate>
      <label for="code">اكتب كود التفعيل</label>
      <div class="code-box" id="code-box">
        <span class="pre">MV</span><span class="dash"></span>
        <span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span>
        <span class="dash"></span>
        <span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span>
        <input id="code" name="code" type="text" inputmode="text" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="16" aria-describedby="lock-msg" dir="ltr">
      </div>
      <p class="lock-msg" id="lock-msg" role="alert"></p>
      <button class="btn wide" id="lock-btn" type="submit" disabled>تفعيل</button>
    </form>
    <p class="lock-help" id="lock-help" hidden>ما عندك كود؟ <a id="lock-support" target="_blank" rel="noopener"></a></p>
  </div>
</main>

<div id="app" hidden></div>
<div id="toasts" role="status" aria-live="polite"></div>
<script type="module" src="/shell.js"></script>
</body>
</html>
